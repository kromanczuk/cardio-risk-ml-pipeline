# CI/CD
#   Pull requests:   lint + tests (+ Docker build checks for the parts that changed).
#   Push to main:    lint + tests, then redeploy ONLY what changed:
#                      backend files  -> API  (Cloud Run heart-api)
#                      frontend files -> UI   (Cloud Run heart-ui)
#   Manual run:      Actions tab -> CI/CD -> "Run workflow" to force a deploy (main only).
# Model training/upload stays manual; promote a model by changing serving.model_version
# in config.yaml via a PR, which redeploys the API on merge.

name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "What to deploy"
        type: choice
        options: [all, api, ui]
        default: all

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.17.6"
  # Created by deploy/setup_github_deploy.sh (not secrets: they only work for this repo's main).
  GCP_WIF_PROVIDER: projects/970173333207/locations/global/workloadIdentityPools/github/providers/github-actions
  GCP_DEPLOYER_SA: heart-mlops-deployer@heart-mlops.iam.gserviceaccount.com
  GCP_REGION: us-east1

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "ruff==${RUFF_VERSION}"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'src/**'
              - 'Dockerfile'
              - 'requirements-api.txt'
              - 'config.yaml'
              - 'deploy/deploy.sh'
            ui:
              - 'frontend/**'
              - 'deploy/deploy.sh'

  docker-build:
    name: Docker build check
    if: github.event_name == 'pull_request'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        if: needs.changes.outputs.api == 'true'
        run: docker build --target api -t heart-api:ci .
      - name: Build UI image
        if: needs.changes.outputs.ui == 'true'
        run: docker build -t heart-ui:ci frontend

  deploy-api:
    name: Deploy API
    needs: [lint, test, changes]
    if: >-
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && needs.changes.outputs.api == 'true') ||
        (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","api"]'), inputs.deploy))
      )
    runs-on: ubuntu-latest
    concurrency: deploy-api   # never two API deploys at once
    permissions:
      contents: read
      id-token: write         # lets the job request a GitHub OIDC token for GCP
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - run: bash deploy/deploy.sh api

  deploy-ui:
    name: Deploy UI
    needs: [lint, test, changes]
    if: >-
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && needs.changes.outputs.ui == 'true') ||
        (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","ui"]'), inputs.deploy))
      )
    runs-on: ubuntu-latest
    concurrency: deploy-ui
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - run: bash deploy/deploy.sh ui
